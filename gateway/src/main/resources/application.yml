spring:
  application:
    name: data-engine-gateway
  config:
    import: classpath:base.yml,classpath:cache.yml,classpath:config.yml,classpath:limiter.yml
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowedHeaders: '*'
                allowedMethods: '*'
                allowedOrigins: '*'
          routes:
            - id: data-engine-auth
              uri: lb://data-engine-auth
              predicates:
                - Path=/api/auth/**,/api/token/**
            - id: data-engine-service
              uri: lb://data-engine-service
              predicates:
                - Path=/api/data/**,/api/service/**
            - id: data-engine-admin
              uri: lb://data-engine-admin
              predicates:
                - Path=/api/userManage/**,/api/role/**
            - id: data-engine-user
              uri: lb://data-engine-user
              predicates:
                - Path=/api/user/**
            - id: data-engine-ds-manager
              uri: lb://data-engine-ds-manager
              predicates:
                - Path=/api/data/**

# Sa-Token配置
sa-token:
  # token 名称 (同时也是 cookie 名称)
  token-name: uc
  # token 有效期(单位：秒) 默认30天, -1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率(单位：秒), 如果 token 超过此时间没有访问系统就会被冻结, 默认-1 代表不限制, 永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 (为 true 时允许一起登录, 为 false 时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时, 是否共用一个 token (为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token)
  is-share: true
  # token 风格(默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik)
  token-style: uuid
  # 是否输出操作日志
  is-log: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8081