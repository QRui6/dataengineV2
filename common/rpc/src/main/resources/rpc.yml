dubbo:
  consumer:
    # 设置不进行检查, 否则如果有应用起不起来, 就会报错导致无法启动
    check: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://${urban.carbon.nacos.server.url}
    parameters:
      namespace: ${urban.carbon.dubbo.nacos.namespace}
      group: ${urban.carbon.dubbo.nacos.group}
  application:
    name: ${spring.application.name}
    qos-enable: true
    qos-accept-foreign-ip: false
