urban:
  carbon:
    # PostGreSQL 数据库配置
    postgresql:
      url: "jdbc:postgresql://${DATAENGINE_DB_HOST:localhost}:${DATAENGINE_DB_PORT:5432}/${DATAENGINE_DB_NAME:ucarbon}"
      username: "${DATAENGINE_DB_USER:postgres}"
      password: "${DATAENGINE_DB_PASSWORD:}"
    # Redis 缓存配置
    redis:
      url: "${DATAENGINE_REDIS_HOST:localhost}"
      port: ${DATAENGINE_REDIS_PORT:6379}
      password: "${DATAENGINE_REDIS_PASSWORD:}"
    # Nacos 注册中心配置
    nacos:
      server:
        url: "${DATAENGINE_NACOS_URL:localhost:8848}"
    # Dubbo 服务配置
    dubbo:
      nacos:
        namespace: "${DATAENGINE_DUBBO_NAMESPACE:}"
        group: "dubbo"
      redis:
        url: "${DATAENGINE_REDIS_HOST:localhost}"
        port: ${DATAENGINE_REDIS_PORT:6379}
        password: "${DATAENGINE_REDIS_PASSWORD:}"
    # Sentinel 限流组件的配置
    sentinel:
      url: "${DATAENGINE_SENTINEL_HOST:localhost}"
      port: ${DATAENGINE_SENTINEL_PORT:8090}
      nacos:
        data-id: "data-engine-gateway-sentinel"
    # 文件存储的配置
    file:
      # 切片大小
      slice: "8MB"
      # 单个文件最大尺寸
      totalMaxSize: "5GB"
      # 配置存储到本地文件系统或者存储到HDFS的阈值
      threshold: 128
      # 配置大文件上传的阈值
      max-file-size: "24MB"
      # 配置请求最大的大小
      max-request-size: "32MB"
      # tomcat 配置
      max-http-form-post-size: "32MB"
      # 本地 文件存储的位置
      local:
        enabled: true
        basePath: "/root/Documents/data/dataengine/"
        savePath: "file"
      # HDFS 文件存储的位置
      hdfs:
        enabled: true
        basePath: "/data"
        hdfsHost: "${DATAENGINE_HDFS_HOST:localhost}"
        hdfsPort: ${DATAENGINE_HDFS_PORT:8020}
        hdfsUser: "${DATAENGINE_HDFS_USER:root}"
      minio:
        enabled: true
        basePath: "data"
        host: "${DATAENGINE_MINIO_HOST:localhost}"
        port: ${DATAENGINE_MINIO_PORT:9000}
        user: "${DATAENGINE_MINIO_USER:admin}"
        password: "${DATAENGINE_MINIO_PASSWORD:}"
    # HTTP 连接池配置
    http-pool:
      defaultMaxPerRoute: 2
      maxTotal: 20
      validateAfterInactivity: 2000
      connectTimeout: 2000
      connectionRequestTimeout: 20000
      socketTimeout: 20000
      responseTimeout: 30000
    # GeoServer 配置
    geo-server:
      enabled: true
      baseUrl: "${DATAENGINE_GEOSERVER_URL:http://localhost:5000/geoserver}"
      userName: "${DATAENGINE_GEOSERVER_USER:admin}"
      password: "${DATAENGINE_GEOSERVER_PASSWORD:}"
      workspace: "urban"
      BaseStoreName: "carbon"
      geoCode: "EPSG:4326"
      geoProjection: "EPSG:32662"
